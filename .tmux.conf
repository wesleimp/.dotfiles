unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

setw -g mode-keys vi
setw -g monitor-activity on
set -g visual-activity on
set -g default-terminal "xterm-256color"
set -g mouse on
set -g history-limit 20000
set -g status-interval 2
set -sg escape-time 0

# Reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

set-option -ga terminal-overrides ",xterm-256color:Tc"
set-option -g visual-activity on
set-option -g visual-bell on
set-option -g visual-silence off
set-option -g set-titles on
set-option -g status on
set-option -g status-left-length 80
set-option -g status-right-length 80
set-option -g bell-action none
set-window-option -g monitor-activity on
set-window-option -g automatic-rename on

set-option -g default-shell $SHELL

# Pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Window moving
bind -r C-h swap-window -t :-
bind -r C-l swap-window -t :+

# Window selection
bind -r [ select-window -t :-
bind -r ] select-window -t :+

# Splits
bind | split-window -h
bind - split-window -v

bind-key -r f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"
bind-key -r O run-shell "~/.local/bin/tmux-sessionizer ~/git"
bind-key -r W run-shell "~/.local/bin/tmux-sessionizer ~/workspace"
bind-key -r V run-shell "~/.local/bin/tmux-sessionizer $DOTFILES"

set -g @online_icon "online"
set -g @offline_icon "offline"
set -g @continuum-restore 'off'

set -g @prefix_highlight_fg 'black'
set -g @prefix_highlight_bg 'green'

# plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-prefix-highlight'
set -g @plugin 'tmux-plugins/tmux-online-status'

# Style status bar
set -g status-style fg=white,bg=black
set -g window-status-current-style fg=green,bg=black
set -g pane-active-border-style fg=green,bg=black
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-current-style bg=green,fg=black
set -g window-status-activity-style bg=black,fg=yellow
set -g window-status-separator ""
set -g status-justify centre

set -g status-left "[#S] #{prefix_highlight}"
# set -g status-right "#(tmux-bar)"

run '~/.tmux/plugins/tpm/tpm'
